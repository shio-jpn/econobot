<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>株トレ道場</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="日本株・米国株をプロの水準まで学ぶ学習アプリ。今日の相場の読み解き、チャート演習、質問機能、トピック別のライブラリ。">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+JP:wght@400;500;600;700&display=swap">
<style>
  /* レイアウト: 取引端末風。上にコマンドバーと価格の帯、左にナビ(スマホでは下のタブ)、右に12列のパネル。暗色で統一した単一テーマ */
  :root {
    color-scheme: dark;
    --bg: #0a0d10; --panel: #10151a; --panel2: #141b21; --raise: #1a232b; --line: #222d36; --line2: #2e3b46;
    --ink: #e8eef3; --text: #c3ced7; --muted: #7f8d99; --faint: #56636e;
    --accent: #f4a523; --accent-ink: #1a1203; --accent-soft: rgba(244, 165, 35, 0.12);
    --info: #4db6e6; --pro: #b18cff; --prac: #f4a523; --adv: #4db6e6;
    --green: #22c58b; --red: #f6475d; --blue: #5b8cff;
    --up: var(--green); --down: var(--red); --c-up: var(--green); --c-dn: var(--red);
    --ma1: #f4a523; --ma2: #4db6e6;
    --warn: #f4a523; --warn-bg: rgba(244, 165, 35, 0.08); --mark: rgba(244, 165, 35, 0.3);
    --mono: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
    --sans: 'IBM Plex Sans JP', 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', 'Yu Gothic UI', sans-serif;
    --gl: max(16px, env(safe-area-inset-left, 0px)); --gr: max(16px, env(safe-area-inset-right, 0px));
  }
  :root[data-candle="jp"] { --c-up: var(--red); --c-dn: var(--blue); }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 15px; line-height: 1.75; overflow-wrap: anywhere; }
  [hidden] { display: none !important; }
  a { color: var(--info); text-decoration: none; }
  a:hover { text-decoration: underline; text-underline-offset: 3px; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  h1, h2, h3, h4, p, ul, ol, dl, dd, figure, fieldset { margin: 0; }
  h1, h2, h3, h4 { color: var(--ink); line-height: 1.4; text-wrap: balance; }
  h1 { font-size: clamp(1.4rem, 3.4vw, 1.85rem); font-weight: 700; letter-spacing: 0.01em; }
  h3 { font-size: 1.02rem; } h4 { font-size: 0.95rem; }
  button, input, select, textarea { font: inherit; color: inherit; }
  code { font-family: var(--mono); font-size: 0.88em; background: var(--raise); padding: 1px 5px; border-radius: 3px; }
  svg.ico { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  .up { color: var(--up); } .down { color: var(--down); }

  /* ---- 上部: コマンドバーと価格の帯 ---- */
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--panel); }
  .top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--panel); border-bottom: 1px solid var(--line); }
  .top-in { display: flex; align-items: center; gap: 12px; height: 54px; padding-left: var(--gl); padding-right: var(--gr); }
  .icon-btn { width: 38px; height: 38px; display: none; align-items: center; justify-content: center; border: 1px solid var(--line2); background: var(--panel2); border-radius: 4px; cursor: pointer; color: var(--ink); flex: none; }
  .brand { display: flex; align-items: center; gap: 10px; color: var(--ink); text-decoration: none !important; flex: none; }
  .brand-mark { width: 30px; height: 30px; display: grid; place-items: center; background: var(--accent); color: var(--accent-ink); font-weight: 700; border-radius: 3px; font-size: 15px; }
  .brand-t { display: flex; flex-direction: column; line-height: 1.15; }
  .brand-t b { font-family: var(--mono); font-size: 13px; letter-spacing: 0.14em; font-weight: 600; }
  .brand-t small { font-size: 11px; color: var(--muted); }
  .cmd { flex: 1; min-width: 0; display: flex; align-items: center; height: 38px; background: var(--bg); border: 1px solid var(--line2); border-radius: 4px; max-width: 720px; }
  .cmd:focus-within { border-color: var(--accent); }
  .cmd-p { font-family: var(--mono); color: var(--accent); padding: 0 6px 0 12px; font-weight: 600; }
  .cmd input { flex: 1; min-width: 0; border: 0; background: none; height: 100%; outline: none; font-size: 16px; color: var(--ink); }
  .cmd input::placeholder { color: var(--faint); }
  .cmd-btn { height: 100%; padding: 0 14px; border: 0; border-left: 1px solid var(--line2); background: var(--accent-soft); color: var(--accent); font-weight: 600; cursor: pointer; white-space: nowrap; border-radius: 0 4px 4px 0; }
  .top-stat { display: flex; gap: 6px; margin-left: auto; flex: none; }
  .ts { display: flex; flex-direction: column; align-items: flex-end; font-family: var(--mono); font-size: 13px; color: var(--ink); line-height: 1.2; padding: 2px 8px; border-left: 1px solid var(--line); text-decoration: none !important; }
  .ts em { font-style: normal; font-size: 10px; color: var(--muted); letter-spacing: 0.1em; }
  .ticker { border-top: 1px solid var(--line); background: var(--bg); overflow-x: auto; scrollbar-width: none; }
  .ticker::-webkit-scrollbar { display: none; }
  .tk-row { display: flex; padding-left: var(--gl); padding-right: var(--gr); white-space: nowrap; }
  .tk { display: inline-flex; align-items: baseline; gap: 8px; padding: 6px 14px 6px 0; margin-right: 14px; border-right: 1px solid var(--line); font-family: var(--mono); font-size: 12px; color: var(--text); text-decoration: none !important; }
  .tk-n { color: var(--muted); font-family: var(--sans); }
  .tk-v { color: var(--ink); }
  .tk-src { font-family: var(--mono); font-size: 11px; color: var(--faint); padding: 6px 0; }

  /* ---- 本体: 左ナビと内容 ---- */
  .shell { display: grid; grid-template-columns: 208px minmax(0, 1fr); min-height: calc(100vh - 56px); }
  .side { border-right: 1px solid var(--line); padding: 14px 10px 40px max(10px, env(safe-area-inset-left, 0px)); position: sticky; top: 56px; align-self: start; height: calc(100vh - 56px); overflow-y: auto; }
  .side-h, .menu .side-h { font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.16em; color: var(--faint); margin: 16px 8px 6px; text-transform: uppercase; }
  .side-h:first-child { margin-top: 2px; }
  .side a, .menu a { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 4px; color: var(--text); font-size: 14px; text-decoration: none !important; position: relative; }
  .side a:hover, .menu a:hover { background: var(--panel2); color: var(--ink); }
  .side a[aria-current], .menu a[aria-current] { background: var(--accent-soft); color: var(--accent); }
  .side a[aria-current]::before { content: ""; position: absolute; left: -10px; top: 6px; bottom: 6px; width: 2px; background: var(--accent); }
  .badge { margin-left: auto; font-style: normal; font-family: var(--mono); font-size: 11px; background: var(--accent); color: var(--accent-ink); padding: 0 6px; border-radius: 9px; line-height: 18px; }
  main { min-width: 0; padding-block: 20px 60px; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: var(--gr); display: flex; flex-direction: column; gap: 14px; max-width: 1240px; }
  .dock { display: none; }

  /* ---- パネル ---- */
  main section, .card, .page-head { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 16px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
  main section > h2, .card > h3:first-child { margin: -16px -16px 4px; padding: 9px 16px; border-bottom: 1px solid var(--line); font-size: 13px; font-weight: 600; color: var(--ink); display: flex; align-items: center; gap: 10px; background: var(--panel2); border-radius: 6px 6px 0 0; letter-spacing: 0.02em; }
  main section > h2::before { content: ""; width: 6px; height: 6px; background: var(--accent); border-radius: 1px; flex: none; }
  .card > h3:first-child { font-size: 13px; }
  .h-r { margin-left: auto; font-family: var(--mono); font-size: 11px; color: var(--muted); font-weight: 500; letter-spacing: 0.08em; }
  .page-head { gap: 8px; background: linear-gradient(180deg, var(--panel2), var(--panel)); }
  .eyebrow { font-family: var(--mono); font-size: 11px; letter-spacing: 0.18em; color: var(--accent); }
  .crumb { font-size: 12.5px; color: var(--muted); }
  .crumb a { color: var(--muted); }
  .lead { color: var(--text); max-width: 52em; }
  .sub { color: var(--muted); font-size: 13px; }
  .empty { color: var(--muted); }
  .disclaimer { font-size: 12px; color: var(--faint); line-height: 1.7; padding: 4px 2px; }
  ul.plain { list-style: none; padding: 0; display: flex; flex-direction: column; gap: 5px; }
  main ul, main ol { padding-left: 1.3em; display: flex; flex-direction: column; gap: 4px; }
  .dash { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 14px; }
  .dash > * { grid-column: span 12; }
  .span-4 { grid-column: span 4 !important; } .span-5 { grid-column: span 5 !important; } .span-6 { grid-column: span 6 !important; } .span-7 { grid-column: span 7 !important; } .span-8 { grid-column: span 8 !important; }
  .stack { display: flex; flex-direction: column; gap: 14px; min-width: 0; }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 38px; padding: 6px 16px; border-radius: 4px; border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink); font-weight: 600; font-size: 14px; text-decoration: none !important; cursor: pointer; line-height: 1.35; text-align: center; }
  .btn.ghost { background: transparent; color: var(--ink); border-color: var(--line2); }
  .btn.ghost:hover { border-color: var(--accent); color: var(--accent); }
  .btn.small { min-height: 32px; padding: 4px 12px; font-size: 13px; }
  .btn:disabled { opacity: 0.4; cursor: default; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .chips-label { font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.12em; color: var(--faint); text-transform: uppercase; margin-right: 2px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; min-height: 30px; padding: 3px 11px; border-radius: 3px; border: 1px solid var(--line2); background: var(--panel2); color: var(--text); font-size: 13px; text-decoration: none !important; cursor: pointer; line-height: 1.4; text-align: left; }
  .chip:hover { border-color: var(--accent); color: var(--ink); }
  .chip.on { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
  .chip em { font-style: normal; font-family: var(--mono); font-size: 11px; color: var(--muted); }
  .term { background: none; border: 0; padding: 0; color: inherit; cursor: pointer; text-decoration: underline dotted var(--accent); text-decoration-thickness: 1px; text-underline-offset: 4px; }
  .term:hover { color: var(--accent); }
  .lv { display: inline-block; font-family: var(--mono); font-size: 10.5px; font-weight: 600; padding: 0 6px; border-radius: 2px; line-height: 1.75; vertical-align: 2px; border: 1px solid currentColor; white-space: nowrap; }
  .lv-base { color: var(--muted); } .lv-adv { color: var(--adv); } .lv-prac { color: var(--prac); } .lv-pro { color: var(--pro); }
  .pill { display: inline-block; white-space: nowrap; font-size: 12px; font-weight: 600; padding: 0 8px; border-radius: 2px; border: 1px solid currentColor; line-height: 1.7; }
  .pill.up { color: var(--up); } .pill.down { color: var(--down); } .pill.flat { color: var(--muted); } .pill.warn { color: var(--warn); }

  /* ---- ダッシュボード ---- */
  .rank { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; } .rank strong { font-size: 1.5rem; color: var(--accent); }
  .kv { display: flex; flex-direction: column; } .kv div { display: flex; justify-content: space-between; gap: 10px; padding: 6px 0; border-bottom: 1px dashed var(--line); font-size: 13.5px; }
  .kv dt { color: var(--muted); } .kv dd { font-family: var(--mono); color: var(--ink); text-align: right; }
  .regime-t { font-size: 1.08rem; font-weight: 700; color: var(--accent); }
  .skill { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px 22px; }
  .skill-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; color: var(--text); text-decoration: none !important; align-items: center; }
  .skill-n b { font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.12em; color: var(--faint); margin-right: 8px; font-weight: 500; }
  .skill-v { font-family: var(--mono); font-size: 11.5px; color: var(--muted); }
  .meter { grid-column: 1 / -1; position: relative; height: 6px; background: var(--raise); border-radius: 1px; display: block; }
  .meter > i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--line2); border-radius: 1px; } .meter > i + i { background: var(--accent); }
  .meter.big { height: 6px; } .meter.big > i { background: var(--accent); }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 12px; color: var(--muted); }
  .legend i { display: inline-block; width: 10px; height: 6px; margin-right: 6px; background: var(--line2); vertical-align: 1px; } .legend i.on { background: var(--accent); }
  .area-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
  .area { border: 1px solid var(--line); border-radius: 4px; background: var(--panel2); min-width: 0; }
  .area-h { display: block; padding: 8px 12px; border-bottom: 1px solid var(--line); color: var(--ink); font-weight: 600; font-size: 14px; text-decoration: none !important; }
  .area-h b { display: block; font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.14em; color: var(--accent); font-weight: 500; }
  .area ul { list-style: none; padding: 6px 0; gap: 0; }
  .area li a { display: flex; justify-content: space-between; gap: 8px; padding: 4px 12px; color: var(--text); font-size: 13.5px; text-decoration: none !important; }
  .area li a:hover { background: var(--raise); color: var(--ink); }
  .area em { font-style: normal; font-family: var(--mono); font-size: 11.5px; color: var(--faint); }
  .principles { list-style: none; padding: 0 !important; counter-reset: p; display: grid !important; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; }
  .principles li { counter-increment: p; display: flex; flex-direction: column; gap: 2px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 4px; background: var(--panel2); }
  .principles li::before { content: "0" counter(p); font-family: var(--mono); color: var(--accent); font-size: 12px; }
  .principles strong { color: var(--ink); } .principles span { font-size: 13px; color: var(--muted); line-height: 1.65; }
  .ask-mini { display: flex; gap: 8px; } .ask-mini input { flex: 1; min-width: 0; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 10px; }
  .tile { display: flex; flex-direction: column; gap: 6px; align-items: flex-start; padding: 12px 14px; background: var(--panel2); border: 1px solid var(--line); border-radius: 4px; color: var(--text); line-height: 1.6; }
  .tile strong { color: var(--ink); } .tile span { font-size: 13px; color: var(--muted); flex: 1; }

  /* ---- ライブラリ ---- */
  .topic-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 10px; }
  .topic-card { display: flex; flex-direction: column; gap: 6px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 4px; background: var(--panel2); color: var(--text); text-decoration: none !important; }
  .topic-card:hover { border-color: var(--accent); }
  .topic-card strong { color: var(--ink); }
  .tc-l { font-size: 12.5px; color: var(--muted); line-height: 1.6; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .tc-m { display: flex; gap: 5px; align-items: center; flex-wrap: wrap; } .tc-m em { margin-left: auto; font-style: normal; font-family: var(--mono); font-size: 11.5px; color: var(--faint); }
  .lesson-list { list-style: none; padding: 0 !important; gap: 0 !important; }
  .lesson-list li + li { border-top: 1px solid var(--line); }
  .lesson-list a { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 12px; padding: 10px 4px; color: var(--text); text-decoration: none !important; align-items: start; }
  .lesson-list a:hover { background: var(--panel2); }
  .lesson-list a:hover strong { color: var(--accent); }
  .check { width: 18px; height: 18px; border: 1px solid var(--line2); border-radius: 2px; margin-top: 3px; display: grid; place-items: center; font-size: 11px; font-weight: 700; }
  .done .check { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .ll-body { display: flex; flex-direction: column; line-height: 1.55; min-width: 0; } .ll-body strong { color: var(--ink); font-weight: 600; } .ll-body > span { font-size: 13px; color: var(--muted); }
  .ll-min { font-family: var(--mono); font-size: 11.5px; color: var(--faint); white-space: nowrap; padding-top: 2px; }

  /* ---- レッスン ---- */
  .lesson { display: flex; flex-direction: column; gap: 14px; }
  .lesson-head { background: linear-gradient(180deg, var(--panel2), var(--panel)); border: 1px solid var(--line); border-radius: 6px; padding: 18px; display: flex; flex-direction: column; gap: 8px; }
  .meta { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; font-size: 12.5px; color: var(--muted); font-family: var(--mono); }
  .meta a { font-family: var(--sans); }
  .lesson-grid { display: grid; grid-template-columns: minmax(0, 1fr) 240px; gap: 14px; align-items: start; }
  .lesson-main { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
  .lesson-main > .prose { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 22px 24px; }
  .toc { position: sticky; top: 112px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; max-height: calc(100vh - 130px); overflow-y: auto; }
  .toc-h { font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.16em; color: var(--faint); }
  .toc ol { list-style: none; padding: 0; gap: 2px; counter-reset: t; }
  .toc li { counter-increment: t; font-size: 13px; line-height: 1.5; }
  .toc li a { display: flex; gap: 8px; color: var(--text); padding: 3px 0; }
  .toc li a::before { content: counter(t, decimal-leading-zero); font-family: var(--mono); font-size: 11px; color: var(--faint); padding-top: 1px; }
  .toc li a:hover { color: var(--accent); text-decoration: none; }
  .prose { display: flex; flex-direction: column; gap: 13px; min-width: 0; font-size: 15.5px; line-height: 1.9; max-width: 50em; }
  .prose h3 { margin-top: 18px; padding: 6px 0 6px 12px; border-left: 3px solid var(--accent); font-size: 1.1rem; scroll-margin-top: 120px; background: linear-gradient(90deg, var(--accent-soft), transparent 60%); }
  .prose h3:first-child { margin-top: 0; }
  .prose h4 { margin-top: 6px; color: var(--ink); font-size: 0.98rem; }
  .prose h4::before { content: "▸ "; color: var(--accent); }
  .prose strong { color: var(--ink); font-weight: 600; }
  .prose ul, .prose ol { padding-left: 1.4em; gap: 5px; }
  .prose li::marker { color: var(--faint); }
  .note { border: 1px solid rgba(77, 182, 230, 0.35); background: rgba(77, 182, 230, 0.07); border-radius: 4px; padding: 12px 14px; color: var(--ink); }
  .warn { border: 1px solid rgba(244, 165, 35, 0.35); background: var(--warn-bg); border-radius: 4px; padding: 12px 14px; color: var(--text); }
  .warn-label { display: inline-block; font-family: var(--mono); font-size: 10.5px; font-weight: 600; color: var(--warn); border: 1px solid currentColor; border-radius: 2px; padding: 0 6px; margin-right: 8px; line-height: 1.7; letter-spacing: 0.06em; }
  .table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 4px; max-width: 100%; }
  table { border-collapse: collapse; width: 100%; font-size: 13.5px; line-height: 1.6; }
  th, td { padding: 7px 10px; text-align: left; vertical-align: top; border-bottom: 1px solid var(--line); }
  th { font-size: 11.5px; color: var(--muted); font-weight: 600; white-space: nowrap; background: var(--panel2); letter-spacing: 0.02em; }
  tbody tr:last-child td { border-bottom: 0; }
  tbody tr:hover td { background: rgba(255, 255, 255, 0.015); }
  td:first-child { color: var(--ink); }
  table.num td { font-family: var(--mono); font-size: 13px; white-space: nowrap; } table.num td:first-child { font-family: var(--sans); }
  .quotes td { vertical-align: middle; } .tick-cell { padding: 2px 10px; line-height: 0; }
  .fig { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .chart { background: var(--panel2); border: 1px solid var(--line); border-radius: 4px; overflow: hidden; line-height: 0; min-width: 0; }
