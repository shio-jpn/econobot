<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>株トレ道場</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="実績ある投資家の原則から学ぶ、日本株・米国株の学習アプリ。マクロ経済、企業分析、チャート、リスク管理を基礎から。">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Zen+Old+Mincho:wght@700;900&display=swap">
<style>
  /* レイアウト: 上に検索つきの固定ヘッダーと横スクロールのナビ、本文は1カラム(最大920px、読み物は42emまで) */
  :root {
    --bg: #f3f5f1; --panel: #ffffff; --ink: #12221b; --text: #26352e; --muted: #5c6d65; --line: #d8dfd9;
    --accent: #0b6b4d; --accent-ink: #ffffff; --soft: #e4eee8;
    --warn: #8a5200; --warn-bg: #faf0d9; --mark: #ffe7a0;
    --green: #0f7a55; --red: #c23b2e; --blue: #2a62c9;
    --up: var(--green); --down: var(--red); --c-up: var(--green); --c-dn: var(--red);
    --ma1: #c07000; --ma2: #3559c7;
    --display: 'Zen Old Mincho', 'Hiragino Mincho ProN', 'Yu Mincho', serif;
    --body: 'Zen Kaku Gothic New', 'Hiragino Kaku Gothic ProN', 'Yu Gothic', 'Noto Sans JP', sans-serif;
    --gutter-l: max(16px, env(safe-area-inset-left, 0px)); --gutter-r: max(16px, env(safe-area-inset-right, 0px));
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0e1512; --panel: #17211c; --ink: #eef4f0; --text: #d3ddd7; --muted: #93a49b; --line: #2b3a33;
      --accent: #4fc79b; --accent-ink: #062016; --soft: #1c2b24;
      --warn: #f0b95a; --warn-bg: #2b2412; --mark: #5c4b10;
      --green: #3fc28f; --red: #f0705f; --blue: #7d9bff; --ma1: #f0a93a; --ma2: #8ea6ff;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0e1512; --panel: #17211c; --ink: #eef4f0; --text: #d3ddd7; --muted: #93a49b; --line: #2b3a33;
    --accent: #4fc79b; --accent-ink: #062016; --soft: #1c2b24;
    --warn: #f0b95a; --warn-bg: #2b2412; --mark: #5c4b10;
    --green: #3fc28f; --red: #f0705f; --blue: #7d9bff; --ma1: #f0a93a; --ma2: #8ea6ff;
    color-scheme: dark;
  }
  :root[data-candle="jp"] { --c-up: var(--red); --c-dn: var(--blue); }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--body); font-size: 16px; line-height: 1.85; overflow-wrap: anywhere; }
  [hidden] { display: none !important; }
  a { color: var(--accent); text-underline-offset: 3px; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
  h1, h2, h3, h4, p, ul, ol, dl, dd, figure { margin: 0; }
  h1, h2 { font-family: var(--display); color: var(--ink); line-height: 1.35; text-wrap: balance; letter-spacing: 0.01em; }
  h1 { font-size: clamp(1.7rem, 4.5vw, 2.3rem); font-weight: 900; }
  h2 { font-size: 1.3rem; font-weight: 700; }
  h3 { font-size: 1.06rem; color: var(--ink); line-height: 1.5; }
  h4 { font-size: 1rem; color: var(--ink); }
  button, input, select, textarea { font: inherit; color: inherit; }
  .up { color: var(--up); } .down { color: var(--down); }

  /* ヘッダー */
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--panel); }
  .top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--panel); border-bottom: 1px solid var(--line); }
  .top-in { max-width: 952px; margin: 0 auto; padding: 10px var(--gutter-r) 0 var(--gutter-l); }
  .bar { display: flex; align-items: center; gap: 14px; }
  .logo { font-family: var(--display); font-weight: 900; font-size: 1.2rem; color: var(--ink); text-decoration: none; white-space: nowrap; display: flex; align-items: center; gap: 8px; }
  .logo svg { width: 22px; height: 22px; flex: none; }
  #search-form { flex: 1; min-width: 0; position: relative; }
  #q { width: 100%; height: 42px; padding: 0 14px 0 40px; border: 1.5px solid var(--line); border-radius: 21px; background: var(--bg); font-size: 16px; }
  #q:focus { outline: none; border-color: var(--accent); background: var(--panel); }
  #search-form svg { position: absolute; left: 13px; top: 12px; width: 18px; height: 18px; color: var(--muted); pointer-events: none; }
  #nav { display: flex; gap: 2px; overflow-x: auto; margin: 6px -8px 0; scrollbar-width: none; }
  #nav::-webkit-scrollbar { display: none; }
  #nav a { flex: none; padding: 8px 12px 9px; font-size: 0.92rem; font-weight: 500; color: var(--muted); text-decoration: none; border-bottom: 3px solid transparent; white-space: nowrap; }
  #nav a:hover { color: var(--ink); }
  #nav a[aria-current] { color: var(--ink); font-weight: 700; border-bottom-color: var(--accent); }

  main { max-width: 952px; margin: 0 auto; padding-block: 28px 72px; padding-left: var(--gutter-l); padding-right: var(--gutter-r); display: flex; flex-direction: column; gap: 40px; min-width: 0; }
  main > section, .lesson { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
  .page-head { display: flex; flex-direction: column; gap: 10px; }
  .lead { font-size: 1.02rem; color: var(--text); max-width: 42em; }
  .sub { color: var(--muted); font-size: 0.94rem; max-width: 44em; }
  .eyebrow, .crumb { font-size: 0.85rem; color: var(--muted); font-weight: 500; }
  .crumb a { color: var(--muted); }
  .disclaimer { font-size: 0.84rem; color: var(--muted); border-top: 1px solid var(--line); padding-top: 16px; }
  .empty { color: var(--muted); }
  ul.plain { list-style: none; padding: 0; display: flex; flex-direction: column; gap: 4px; }

  .btn { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: 8px 20px; border-radius: 8px; border: 1.5px solid var(--accent); background: var(--accent); color: var(--accent-ink); font-weight: 700; text-decoration: none; cursor: pointer; line-height: 1.4; }
  .btn.ghost { background: transparent; color: var(--accent); }
  .btn:hover { filter: brightness(1.08); }
  .link { background: none; border: 0; padding: 4px; color: var(--muted); text-decoration: underline; cursor: pointer; font-size: 0.85rem; }
  .actions { display: flex; flex-wrap: wrap; gap: 10px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .chips-label { font-size: 0.82rem; color: var(--muted); font-weight: 700; margin-right: 2px; }
  .chip { display: inline-flex; align-items: center; min-height: 36px; padding: 4px 14px; border-radius: 18px; border: 1px solid var(--line); background: var(--panel); color: var(--text); font-size: 0.92rem; text-decoration: none; cursor: pointer; }
  .chip:hover { border-color: var(--accent); color: var(--accent); }
  .chip.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 700; }
  .term { background: none; border: 0; padding: 0; color: inherit; cursor: pointer; text-decoration: underline dotted var(--accent); text-decoration-thickness: 1.5px; text-underline-offset: 4px; }
  .term:hover { color: var(--accent); }

  /* ホーム */
  .home-top { display: grid !important; grid-template-columns: minmax(0, 1fr) 280px; gap: 32px; align-items: start; }
  .home-main { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
  .meter { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 20px; display: flex; flex-direction: column; gap: 6px; }
  .meter-n { font-size: 1rem; color: var(--muted); font-variant-numeric: tabular-nums; }
  .meter-n span { font-family: var(--display); font-size: 2.6rem; font-weight: 900; color: var(--ink); line-height: 1; }
  .meter-l { font-size: 0.85rem; color: var(--muted); }
  .pbar, .pbar > i { display: block; height: 8px; border-radius: 4px; }
  .pbar { background: var(--soft); margin: 6px 0 8px; overflow: hidden; }
  .pbar > i { background: var(--accent); }
  .meter dl { display: flex; flex-direction: column; gap: 4px; font-size: 0.9rem; }
  .meter dl div { display: flex; justify-content: space-between; gap: 8px; }
  .meter dt { color: var(--muted); } .meter dd { font-weight: 700; color: var(--ink); font-variant-numeric: tabular-nums; }
  .principles { list-style: none; padding: 0; counter-reset: p; display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 0 28px; }
  .principles li { counter-increment: p; display: grid; grid-template-columns: 2.2em 1fr; padding: 12px 0; border-top: 1px solid var(--line); }
  .principles li::before { content: counter(p); font-family: var(--display); font-weight: 900; font-size: 1.5rem; color: var(--accent); line-height: 1.3; grid-row: span 2; }
  .principles strong { color: var(--ink); } .principles span { font-size: 0.92rem; color: var(--muted); line-height: 1.7; }
  .road { display: flex; flex-direction: column; }
  .road-item { display: grid; grid-template-columns: 40px 1fr auto; gap: 14px; align-items: center; padding: 12px 4px; border-top: 1px solid var(--line); text-decoration: none; color: var(--text); }
  .road-item:last-child { border-bottom: 1px solid var(--line); }
  .road-item:hover strong { color: var(--accent); }
  .road-no { width: 40px; height: 40px; border-radius: 50%; border: 1.5px solid var(--ink); display: flex; align-items: center; justify-content: center; font-family: var(--display); font-weight: 900; color: var(--ink); flex: none; }
  .road-item.done .road-no { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .road-body { display: flex; flex-direction: column; min-width: 0; line-height: 1.6; }
  .road-body strong { color: var(--ink); } .road-body span { font-size: 0.9rem; color: var(--muted); }
  .road-n { font-size: 0.88rem; color: var(--muted); font-variant-numeric: tabular-nums; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
  .tile { display: flex; flex-direction: column; gap: 6px; align-items: flex-start; padding: 16px 18px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; text-decoration: none; color: var(--text); line-height: 1.65; }
  a.tile:hover { border-color: var(--accent); }
  .tile strong { color: var(--ink); font-size: 1.04rem; } .tile span { font-size: 0.9rem; color: var(--muted); flex: 1; }
  .tile .btn { margin-top: 6px; }

  /* カリキュラム */
  .stage { scroll-margin-top: 120px; }
  .stage-head { display: grid; grid-template-columns: 40px 1fr auto; gap: 14px; align-items: center; }
  .lesson-list { list-style: none; padding: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .lesson-list li + li { border-top: 1px solid var(--line); }
  .lesson-list a { display: grid; grid-template-columns: 24px 1fr; gap: 12px; padding: 12px 16px; text-decoration: none; color: var(--text); align-items: start; }
  .lesson-list a:hover { background: var(--soft); }
  .check { width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--line); margin-top: 4px; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; }
  .done .check { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .ll-body { display: flex; flex-direction: column; line-height: 1.6; min-width: 0; }
  .ll-body strong { color: var(--ink); } .ll-body span { font-size: 0.9rem; color: var(--muted); }

  /* 読み物 */
  .prose { display: flex; flex-direction: column; gap: 14px; max-width: 46em; min-width: 0; }
  .prose h3 { margin-top: 18px; padding-bottom: 6px; border-bottom: 1px solid var(--line); font-size: 1.14rem; }
  .prose h4 { margin-top: 6px; }
  .prose ul { padding-left: 1.3em; display: flex; flex-direction: column; gap: 6px; }
  .prose strong { color: var(--ink); }
  .note { background: var(--soft); border-radius: 8px; padding: 14px 16px; color: var(--ink); font-weight: 500; }
  .warn { background: var(--warn-bg); border-radius: 8px; padding: 14px 16px; color: var(--text); }
  .warn-label { display: inline-block; font-size: 0.78rem; font-weight: 700; color: var(--warn); border: 1px solid currentColor; border-radius: 4px; padding: 0 6px; margin-right: 8px; line-height: 1.6; }
  .table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); max-width: 100%; }
  table { border-collapse: collapse; width: 100%; font-size: 0.93rem; line-height: 1.6; font-variant-numeric: tabular-nums; }
  th, td { padding: 9px 12px; text-align: left; vertical-align: top; border-bottom: 1px solid var(--line); }
  th { font-size: 0.82rem; color: var(--muted); font-weight: 700; white-space: nowrap; background: var(--bg); }
  tbody tr:last-child td { border-bottom: 0; }
  td:first-child { font-weight: 500; color: var(--ink); }
  .fig { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  .chart { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; line-height: 0; min-width: 0; }
  .chart svg { display: block; max-width: 100%; height: auto; }
  figcaption { font-size: 0.87rem; color: var(--muted); line-height: 1.7; }
  .related { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; display: flex; flex-direction: column; gap: 8px; max-width: 46em; }
  .res-k { font-size: 0.76rem; font-weight: 700; color: var(--muted); letter-spacing: 0.04em; }
  .pager { display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; border-top: 1px solid var(--line); padding-top: 16px; font-size: 0.95rem; }
  .sources { font-size: 0.9rem; color: var(--muted); }

  /* チャートの線と文字(色はすべてトークンから) */
  .c-grid { stroke: var(--line); stroke-width: 1; } .c-dash { stroke-dasharray: 4 4; stroke: var(--muted); opacity: 0.6; }
  .c-axis, .c-pane, .c-legend { font: 11px var(--body); fill: var(--muted); font-variant-numeric: tabular-nums; }
  .c-up { fill: var(--c-up); stroke: var(--c-up); } .c-dn { fill: var(--c-dn); stroke: var(--c-dn); }
  .c-vol { opacity: 0.6; stroke: none; }
  .c-ma, .c-ind, .c-bb, .c-bbmid, .c-path, .c-median { fill: none; }
  .c-ma { stroke-width: 1.8; } .c-ma1 { stroke: var(--ma1); } .c-ma2 { stroke: var(--ma2); }
  .c-ma1t, .c-sigt { fill: var(--ma1); } .c-ma2t, .c-bbt, .c-indt { fill: var(--ma2); }
  .c-bb { stroke: var(--ma2); stroke-width: 1.2; } .c-bbmid { stroke: var(--ma2); stroke-width: 1; stroke-dasharray: 3 3; opacity: 0.7; }
  .c-ind { stroke: var(--ma2); stroke-width: 1.6; } .c-sig { stroke: var(--ma1); }
  .c-hist { fill: var(--muted); opacity: 0.45; }
  .c-line { stroke-width: 1.5; stroke-dasharray: 6 4; } .c-neck { stroke: var(--ink); opacity: 0.55; } .c-sup { stroke: var(--accent); } .c-res { stroke: var(--warn); }
  .c-dot { fill: var(--ink); stroke: var(--panel); stroke-width: 1.5; }
  .c-mark { font: 700 12px var(--body); fill: var(--ink); paint-order: stroke; stroke: var(--panel); stroke-width: 4px; stroke-linejoin: round; }
  .c-path { stroke: var(--muted); stroke-width: 1; opacity: 0.35; } .c-median { stroke: var(--accent); stroke-width: 2.6; }

  /* 問題 */
  .quiz { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 22px; max-width: 46em; gap: 16px !important; display: flex; flex-direction: column; }
  .q { display: flex; flex-direction: column; gap: 10px; padding-top: 16px; border-top: 1px solid var(--line); }
  .q-n { font-size: 0.8rem; font-weight: 700; color: var(--muted); }
  .q-t { font-weight: 700; color: var(--ink); font-size: 1.04rem; line-height: 1.65; }
  .q-opts { display: flex; flex-direction: column; gap: 8px; }
  .opt { text-align: left; min-height: 46px; padding: 10px 14px; border: 1.5px solid var(--line); border-radius: 8px; background: var(--bg); cursor: pointer; line-height: 1.55; }
  .opt:hover:not(:disabled) { border-color: var(--accent); }
  .opt:disabled { cursor: default; opacity: 0.75; }
  .opt.right { border-color: var(--up); opacity: 1; font-weight: 700; } .opt.right::after { content: " ✓"; color: var(--up); }
  .opt.wrong { border-color: var(--down); opacity: 1; } .opt.wrong::after { content: " ✕"; color: var(--down); }
  .q-exp { background: var(--soft); border-radius: 8px; padding: 12px 14px; font-size: 0.95rem; }
  .quiz-done, .quiz-next { display: flex; flex-direction: column; gap: 12px; align-items: flex-start; padding-top: 16px; border-top: 1px solid var(--line); }
  .boxes { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; max-width: 46em; }
  .boxes div { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 4px; text-align: center; display: flex; flex-direction: column; }
  .box-n { font-family: var(--display); font-weight: 900; font-size: 1.4rem; color: var(--ink); line-height: 1.3; } .box-l { font-size: 0.74rem; color: var(--muted); }

  /* 検索結果 */
  .count { color: var(--muted); font-size: 0.92rem; }
  mark { background: var(--mark); color: inherit; border-radius: 2px; padding: 0 1px; }
  .hero-term { background: var(--panel); border: 1.5px solid var(--accent); border-radius: 12px; padding: 20px 22px; gap: 8px !important; }
  .hero-term h2 { font-size: 1.6rem; } .aka { font-size: 0.86rem; color: var(--muted); }
  .results ul { list-style: none; padding: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .results li + li { border-top: 1px solid var(--line); }
  .results .n { font-family: var(--body); font-size: 0.85rem; color: var(--muted); font-weight: 500; }
  .res { display: flex; flex-direction: column; gap: 2px; width: 100%; padding: 12px 16px; text-align: left; background: none; border: 0; text-decoration: none; color: var(--text); cursor: pointer; line-height: 1.6; }
  .res:hover { background: var(--soft); }
  .res-t { font-weight: 700; color: var(--ink); } .res-s { font-size: 0.9rem; color: var(--muted); }
  .more { font-size: 0.86rem; color: var(--muted); }

  /* 用語ポップアップ */
  #sheet { position: fixed; inset: 0; z-index: 40; background: rgba(0, 0, 0, 0.45); display: flex; align-items: flex-end; justify-content: center; }
  .sheet-panel { background: var(--panel); color: var(--text); width: 100%; max-width: 560px; max-height: 82%; overflow-y: auto; border-radius: 16px 16px 0 0; padding: 22px max(20px, env(safe-area-inset-right, 0px)) calc(22px + env(safe-area-inset-bottom, 0px)) max(20px, env(safe-area-inset-left, 0px)); position: relative; }
  #sheet-body { display: flex; flex-direction: column; gap: 10px; }
  #sheet-close { position: absolute; top: 10px; right: 10px; width: 44px; height: 44px; border: 0; background: none; font-size: 1.5rem; color: var(--muted); cursor: pointer; border-radius: 50%; }
  .sheet-sub { font-size: 0.82rem; font-weight: 700; color: var(--muted); margin-top: 6px; }
  @media (min-width: 640px) { #sheet { align-items: center; } .sheet-panel { border-radius: 16px; } }

  /* 因果マップ */
  .macro-pick { display: flex; flex-direction: column; gap: 10px; }
  .pick-group { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .pick-group .chips-label { flex: 0 0 100%; }
  .macro-card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 22px; scroll-margin-top: 120px; }
  .macro-card h3 { margin-top: 10px; }
  .chain { list-style: none; padding: 0; display: flex; flex-wrap: wrap; gap: 8px 0; align-items: stretch; }
  .chain li { background: var(--soft); color: var(--ink); font-weight: 500; padding: 8px 14px; border-radius: 8px; font-size: 0.94rem; line-height: 1.55; display: flex; align-items: center; margin-right: 30px; position: relative; max-width: 100%; }
  .chain li:not(:last-child)::after { content: "→"; position: absolute; right: -23px; color: var(--muted); font-weight: 700; }
  .chain li:last-child { background: var(--accent); color: var(--accent-ink); margin-right: 0; }
  .pill { display: inline-block; white-space: nowrap; font-size: 0.82rem; font-weight: 700; padding: 1px 9px; border-radius: 12px; border: 1.5px solid currentColor; }
  .pill.up { color: var(--up); } .pill.down { color: var(--down); } .pill.flat { color: var(--muted); }

  /* チャート図鑑・人物・用語集 */
  .chart-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
  .chart-card { display: flex; flex-direction: column; gap: 8px; text-decoration: none; color: var(--ink); min-width: 0; }
  .chart-card:hover strong { color: var(--accent); }
  .seg { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
