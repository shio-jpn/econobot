<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>株トレ道場</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="実績ある投資家の原則から学ぶ、日本株・米国株の学習アプリ。マクロ経済、企業分析、チャート、リスク管理を基礎から。">
<link rel="icon" href="data:,">
<style>
  /* レイアウト: 淡い背景に角の丸い白いカードを積む。上に丸い浮きボタン、下に浮いたタブバー。本文は1カラム(最大760px) */
  :root {
    --bg: #eeeef3; --panel: #ffffff; --tile: #f1f1f6; --ink: #1b1b1f; --text: #2f2f36; --muted: #7c7c88; --line: #e3e3ea;
    --accent: #6a59ad; --accent-ink: #ffffff; --soft: #eceaf6; --rose: #c9879a; --fab: #f6dccb; --fab-ink: #2a2019;
    --warn: #8a5200; --warn-bg: #fbf1dd; --mark: #ffe7a0; --hero: #15141c;
    --green: #128a61; --red: #cf4436; --blue: #2f66d0;
    --up: var(--green); --down: var(--red); --c-up: var(--green); --c-dn: var(--red);
    --ma1: #c07000; --ma2: #5a4fc0;
    --shadow: 0 1px 2px rgba(30, 30, 60, 0.05), 0 10px 28px rgba(60, 60, 100, 0.08);
    --glass: rgba(255, 255, 255, 0.72);
    --body: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic UI', 'Noto Sans JP', 'Segoe UI', sans-serif;
    --display: var(--body);
    --gutter-l: max(16px, env(safe-area-inset-left, 0px)); --gutter-r: max(16px, env(safe-area-inset-right, 0px));
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #101014; --panel: #1c1c22; --tile: #26262e; --ink: #f2f2f6; --text: #d6d6de; --muted: #9a9aa8; --line: #2e2e38;
      --accent: #b5a8ee; --accent-ink: #17132b; --soft: #26233a; --rose: #e0a3b3; --fab: #f0cfba; --fab-ink: #2a2019;
      --warn: #f0b95a; --warn-bg: #2d2513; --mark: #5c4b10; --hero: #08080c;
      --green: #45c796; --red: #f4776a; --blue: #86a4ff; --ma1: #f0a93a; --ma2: #a79bff;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 10px 28px rgba(0, 0, 0, 0.35); --glass: rgba(40, 40, 50, 0.72);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #101014; --panel: #1c1c22; --tile: #26262e; --ink: #f2f2f6; --text: #d6d6de; --muted: #9a9aa8; --line: #2e2e38;
    --accent: #b5a8ee; --accent-ink: #17132b; --soft: #26233a; --rose: #e0a3b3; --fab: #f0cfba; --fab-ink: #2a2019;
    --warn: #f0b95a; --warn-bg: #2d2513; --mark: #5c4b10; --hero: #08080c;
    --green: #45c796; --red: #f4776a; --blue: #86a4ff; --ma1: #f0a93a; --ma2: #a79bff;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 10px 28px rgba(0, 0, 0, 0.35); --glass: rgba(40, 40, 50, 0.72);
    color-scheme: dark;
  }
  :root[data-candle="jp"] { --c-up: var(--red); --c-dn: var(--blue); }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--body); font-size: 16px; line-height: 1.8; overflow-wrap: anywhere; }
  [hidden] { display: none !important; }
  a { color: var(--accent); text-underline-offset: 3px; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
  h1, h2, h3, h4, p, ul, ol, dl, dd, figure { margin: 0; }
  h1, h2, h3, h4 { color: var(--ink); line-height: 1.4; text-wrap: balance; }
  h1 { font-size: clamp(1.5rem, 4.4vw, 1.9rem); font-weight: 800; letter-spacing: -0.01em; }
  h2 { font-size: 1.18rem; font-weight: 700; }
  h3 { font-size: 1.04rem; } h4 { font-size: 0.98rem; }
  button, input, select, textarea { font: inherit; color: inherit; }
  svg.ico { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  .up { color: var(--up); } .down { color: var(--down); }

  /* 上の浮きボタン */
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
  .top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: linear-gradient(var(--bg) 62%, transparent); }
  .top-in { max-width: 792px; margin: 0 auto; padding: 12px var(--gutter-r) 14px var(--gutter-l); display: flex; align-items: center; gap: 10px; }
  .round, .pill-btns { background: var(--panel); box-shadow: var(--shadow); border: 0; border-radius: 24px; color: var(--ink); }
  .round { width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; cursor: pointer; flex: none; text-decoration: none; }
  .pill-btns { display: flex; margin-left: auto; padding: 0 4px; }
  .pill-btns a, .pill-btns button { width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; border: 0; background: none; cursor: pointer; color: var(--ink); border-radius: 24px; position: relative; }
  .badge { position: absolute; top: 7px; right: 5px; min-width: 17px; height: 17px; padding: 0 4px; border-radius: 9px; background: var(--rose); color: #fff; font-size: 10px; font-weight: 700; line-height: 17px; text-align: center; }
  .top-title { font-weight: 800; color: var(--ink); text-decoration: none; font-size: 1.02rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  #search-form { flex: 1; min-width: 0; position: relative; }
  #q { width: 100%; height: 48px; padding: 0 16px 0 46px; border: 0; border-radius: 24px; background: var(--panel); box-shadow: var(--shadow); font-size: 16px; }
  #q:focus { outline: 2px solid var(--accent); }
  #search-form svg { position: absolute; left: 15px; top: 13px; color: var(--muted); pointer-events: none; }
  .top:not(.searching) #search-form, .top:not(.searching) #search-close { display: none; }
  .top.searching .top-title, .top.searching .pill-btns { display: none; }

  /* 下の浮きタブバー */
  .dock { position: fixed; z-index: 25; left: 0; right: 0; bottom: 0; pointer-events: none; padding: 0 var(--gutter-r) calc(14px + env(safe-area-inset-bottom, 0px)) var(--gutter-l); }
  .dock-in { max-width: 520px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .dock-group { pointer-events: auto; display: flex; padding: 4px; border-radius: 30px; background: var(--glass); -webkit-backdrop-filter: blur(18px) saturate(1.6); backdrop-filter: blur(18px) saturate(1.6); box-shadow: var(--shadow), inset 0 0 0 1px rgba(255, 255, 255, 0.35); }
  .dock-group a { width: 52px; height: 46px; display: flex; flex-direction: column; align-items: center; justify-content: center; border-radius: 24px; color: var(--ink); text-decoration: none; font-size: 9.5px; font-weight: 700; line-height: 1.2; gap: 1px; }
  .dock-group a svg.ico { width: 21px; height: 21px; }
  .dock-group a[aria-current] { background: var(--panel); color: var(--accent); box-shadow: 0 1px 4px rgba(0, 0, 0, 0.12); }
  .fab { pointer-events: auto; width: 60px; height: 60px; border-radius: 30px; background: var(--fab); color: var(--fab-ink); display: flex; align-items: center; justify-content: center; box-shadow: var(--shadow), inset 0 0 0 1px rgba(255, 255, 255, 0.5); text-decoration: none; flex: none; }
  .fab svg.ico { width: 26px; height: 26px; stroke-width: 2.2; }

  main { max-width: 792px; margin: 0 auto; padding-block: 4px 130px; padding-left: var(--gutter-l); padding-right: var(--gutter-r); display: flex; flex-direction: column; gap: 16px; min-width: 0; }
  main > section, .lesson, .page-head, .card { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
  main > section, .page-head, .lesson > .prose, .lesson > .lesson-head, .card { background: var(--panel); border-radius: 28px; padding: 22px; box-shadow: var(--shadow); }
  .lesson { gap: 16px; }
  .lesson-head { display: flex; flex-direction: column; gap: 8px; }
  .lead { font-size: 1rem; color: var(--text); }
  .sub { color: var(--muted); font-size: 0.92rem; }
  .eyebrow, .crumb { font-size: 0.82rem; color: var(--muted); font-weight: 600; }
  .crumb a { color: var(--muted); }
  .disclaimer { font-size: 0.8rem; color: var(--muted); padding: 4px 10px; line-height: 1.7; }
  .empty { color: var(--muted); }
  ul.plain { list-style: none; padding: 0; display: flex; flex-direction: column; gap: 4px; }

  .btn { display: inline-flex; align-items: center; justify-content: center; min-height: 46px; padding: 8px 22px; border-radius: 23px; border: 0; background: var(--accent); color: var(--accent-ink); font-weight: 700; text-decoration: none; cursor: pointer; line-height: 1.4; }
  .btn.ghost { background: var(--soft); color: var(--accent); }
  .btn:hover { filter: brightness(1.06); }
  .actions { display: flex; flex-wrap: wrap; gap: 10px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .chips-label { font-size: 0.8rem; color: var(--muted); font-weight: 700; margin-right: 2px; }
  .chip { display: inline-flex; align-items: center; min-height: 38px; padding: 4px 15px; border-radius: 19px; border: 0; background: var(--tile); color: var(--text); font-size: 0.9rem; text-decoration: none; cursor: pointer; line-height: 1.4; }
  .chip:hover { color: var(--accent); }
  .chip.on { background: var(--accent); color: var(--accent-ink); font-weight: 700; }
  .term { background: none; border: 0; padding: 0; color: inherit; cursor: pointer; text-decoration: underline dotted var(--accent); text-decoration-thickness: 1.5px; text-underline-offset: 4px; }
  .term:hover { color: var(--accent); }

  /* ホーム: 大きな絵のカード、ひとことカード、章の棚 */
  main > section.hero { background: var(--hero); padding: 0; overflow: hidden; position: relative; min-height: 0; gap: 0; }
  .hero .chart { background: none; border-radius: 0; }
  .hero-cap { position: absolute; left: 0; right: 0; bottom: 12px; text-align: center; color: rgba(255, 255, 255, 0.86); font-size: 0.82rem; font-weight: 600; font-variant-numeric: tabular-nums; }
  .hero-title { position: absolute; left: 22px; top: 18px; color: #fff; font-weight: 800; font-size: 1.25rem; letter-spacing: 0.01em; }
  .hero-title small { display: block; font-size: 0.78rem; font-weight: 600; color: rgba(255, 255, 255, 0.7); }
  main > section.say { text-align: left; gap: 6px; }
  .say p:first-child { color: var(--ink); font-size: 1.02rem; }
  .say .stamp { text-align: center; color: var(--muted); font-size: 0.8rem; }
  main > section.shelf { padding: 18px 0 18px; gap: 12px; }
  .shelf-head { display: flex; align-items: center; gap: 10px; padding: 0 22px; text-decoration: none; color: var(--ink); }
  .shelf-head strong { font-size: 1.06rem; flex: 1; min-width: 0; }
  .shelf-head svg.ico { width: 26px; height: 26px; }
  .shelf-n { color: var(--muted); font-size: 0.88rem; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .shelf-row { display: flex; gap: 10px; overflow-x: auto; padding: 0 22px 2px; scrollbar-width: none; }
  .shelf-row::-webkit-scrollbar { display: none; }
  .mini { flex: none; width: 96px; height: 96px; border-radius: 16px; background: var(--tile); color: var(--text); text-decoration: none; font-size: 0.76rem; line-height: 1.45; padding: 9px 10px; overflow: hidden; display: block; position: relative; }
  .mini span { display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  .mini.done span::before { content: "✓ "; color: var(--accent); font-weight: 800; }
  .mini.pic { padding: 0; background: var(--hero); }
  .mini.pic svg { display: block; }
  .hue-0 { color: #8d7cc3; } .hue-1 { color: #c9879a; } .hue-2 { color: #5f9fb8; } .hue-3 { color: #c79a55; } .hue-4 { color: #5fae8c; } .hue-5 { color: #d0786a; } .hue-6 { color: #7f8fd0; } .hue-7 { color: #b684c4; }
  .principles { list-style: none; padding: 0; counter-reset: p; display: flex; flex-direction: column; }
  .principles li { counter-increment: p; display: grid; grid-template-columns: 2.4em 1fr; padding: 10px 0; border-top: 1px solid var(--line); }
  .principles li::before { content: counter(p); font-weight: 800; font-size: 1.3rem; color: var(--accent); line-height: 1.4; grid-row: span 2; }
  .principles strong { color: var(--ink); } .principles span { font-size: 0.9rem; color: var(--muted); line-height: 1.7; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
  .tile { display: flex; flex-direction: column; gap: 4px; align-items: flex-start; padding: 14px 16px; background: var(--tile); border-radius: 18px; text-decoration: none; color: var(--text); line-height: 1.6; }
  .tile strong { color: var(--ink); } .tile span { font-size: 0.86rem; color: var(--muted); flex: 1; }
  .tile .btn { margin-top: 8px; min-height: 40px; }

  /* 章とレッスン一覧 */
  .lesson-list { list-style: none; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  .lesson-list a { display: grid; grid-template-columns: 26px 1fr; gap: 12px; padding: 12px 14px; text-decoration: none; color: var(--text); align-items: start; background: var(--tile); border-radius: 18px; }
  .lesson-list a:hover strong { color: var(--accent); }
  .check { width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid var(--muted); margin-top: 3px; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 800; opacity: 0.6; }
  .done .check { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); opacity: 1; }
  .ll-body { display: flex; flex-direction: column; line-height: 1.55; min-width: 0; }
  .ll-body strong { color: var(--ink); } .ll-body span { font-size: 0.87rem; color: var(--muted); }
  .chapter-nav { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding: 2px; }
  .chapter-nav::-webkit-scrollbar { display: none; }
  .chapter-nav .chip { flex: none; background: var(--panel); box-shadow: var(--shadow); }
  .chapter-nav .chip.on { background: var(--accent); }
  .pbar, .pbar > i { display: block; height: 8px; border-radius: 4px; }
  .pbar { background: var(--tile); overflow: hidden; } .pbar > i { background: var(--accent); }

  /* 読み物 */
  .prose { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
  .prose h3 { margin-top: 14px; font-size: 1.1rem; }
  .prose h3:first-child { margin-top: 0; }
  .prose ul { padding-left: 1.3em; display: flex; flex-direction: column; gap: 6px; }
  .prose strong { color: var(--ink); }
  .note { background: var(--soft); border-radius: 18px; padding: 14px 16px; color: var(--ink); font-weight: 500; }
  .warn { background: var(--warn-bg); border-radius: 18px; padding: 14px 16px; color: var(--text); }
  .warn-label { display: inline-block; font-size: 0.76rem; font-weight: 700; color: var(--warn); border: 1px solid currentColor; border-radius: 8px; padding: 0 7px; margin-right: 8px; line-height: 1.6; }
  .table-wrap { overflow-x: auto; border-radius: 16px; background: var(--tile); max-width: 100%; }
  table { border-collapse: collapse; width: 100%; font-size: 0.9rem; line-height: 1.6; font-variant-numeric: tabular-nums; }
  th, td { padding: 9px 12px; text-align: left; vertical-align: top; border-bottom: 1px solid var(--line); }
  th { font-size: 0.8rem; color: var(--muted); font-weight: 700; white-space: nowrap; }
  tbody tr:last-child td { border-bottom: 0; }
  td:first-child { font-weight: 600; color: var(--ink); }
  .fig { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  .chart { background: var(--tile); border-radius: 18px; overflow: hidden; line-height: 0; min-width: 0; }
  .chart svg { display: block; max-width: 100%; height: auto; }
  figcaption { font-size: 0.85rem; color: var(--muted); line-height: 1.7; padding: 0 4px; }
  .related { display: flex; flex-direction: column; gap: 8px; }
  .res-k { font-size: 0.74rem; font-weight: 700; color: var(--muted); letter-spacing: 0.03em; }
  .pager { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; font-size: 0.9rem; }
  .pager a { background: var(--panel); box-shadow: var(--shadow); border-radius: 22px; padding: 10px 18px; text-decoration: none; line-height: 1.5; max-width: 100%; }
  .sources { font-size: 0.88rem; color: var(--muted); }

  /* チャートの線と文字(色はすべてトークンから) */
  .c-grid { stroke: var(--line); stroke-width: 1; } .c-dash { stroke-dasharray: 4 4; stroke: var(--muted); opacity: 0.6; }
  .c-axis, .c-pane, .c-legend { font: 11px var(--body); fill: var(--muted); font-variant-numeric: tabular-nums; }
  .c-up { fill: var(--c-up); stroke: var(--c-up); } .c-dn { fill: var(--c-dn); stroke: var(--c-dn); }
  .c-vol { opacity: 0.6; stroke: none; }
  .c-ma, .c-ind, .c-bb, .c-bbmid, .c-path, .c-median { fill: none; }
  .c-ma { stroke-width: 1.8; } .c-ma1 { stroke: var(--ma1); } .c-ma2 { stroke: var(--ma2); }
  .c-ma1t, .c-sigt { fill: var(--ma1); } .c-ma2t, .c-bbt, .c-indt { fill: var(--ma2); }
  .c-bb { stroke: var(--ma2); stroke-width: 1.2; } .c-bbmid { stroke: var(--ma2); stroke-width: 1; stroke-dasharray: 3 3; opacity: 0.7; }
  .c-ind { stroke: var(--ma2); stroke-width: 1.6; } .c-sig { stroke: var(--ma1); }
  .c-hist { fill: var(--muted); opacity: 0.45; }
  .c-line { stroke-width: 1.5; stroke-dasharray: 6 4; } .c-neck { stroke: var(--ink); opacity: 0.55; } .c-sup { stroke: var(--accent); } .c-res { stroke: var(--warn); }
  .c-dot { fill: var(--ink); stroke: var(--tile); stroke-width: 1.5; }
  .c-mark { font: 700 12px var(--body); fill: var(--ink); paint-order: stroke; stroke: var(--tile); stroke-width: 4px; stroke-linejoin: round; }
  .c-path { stroke: var(--muted); stroke-width: 1; opacity: 0.35; } .c-median { stroke: var(--accent); stroke-width: 2.6; }

  /* 問題 */
  .quiz { background: var(--panel); border-radius: 28px; padding: 22px; box-shadow: var(--shadow); gap: 16px; display: flex; flex-direction: column; }
  .q { display: flex; flex-direction: column; gap: 10px; padding-top: 16px; border-top: 1px solid var(--line); }
  .q-n { font-size: 0.78rem; font-weight: 700; color: var(--muted); }
  .q-t { font-weight: 700; color: var(--ink); font-size: 1.02rem; line-height: 1.6; }
  .q-opts { display: flex; flex-direction: column; gap: 8px; }
  .opt { text-align: left; min-height: 48px; padding: 10px 16px; border: 2px solid transparent; border-radius: 18px; background: var(--tile); cursor: pointer; line-height: 1.5; }
  .opt:hover:not(:disabled) { border-color: var(--accent); }
  .opt:disabled { cursor: default; opacity: 0.7; }
  .opt.right { border-color: var(--up); opacity: 1; font-weight: 700; } .opt.right::after { content: " ✓"; color: var(--up); }
  .opt.wrong { border-color: var(--down); opacity: 1; } .opt.wrong::after { content: " ✕"; color: var(--down); }
  .q-exp { background: var(--soft); border-radius: 18px; padding: 12px 16px; font-size: 0.93rem; }
  .quiz-done, .quiz-next { display: flex; flex-direction: column; gap: 12px; align-items: flex-start; padding-top: 16px; border-top: 1px solid var(--line); }
  .boxes { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; }
  .boxes div { background: var(--tile); border-radius: 14px; padding: 10px 4px; text-align: center; display: flex; flex-direction: column; }
  .box-n { font-weight: 800; font-size: 1.3rem; color: var(--ink); line-height: 1.3; } .box-l { font-size: 0.72rem; color: var(--muted); }

  /* 検索結果 */
  .count { color: var(--muted); font-size: 0.88rem; padding: 0 10px; }
  mark { background: var(--mark); color: inherit; border-radius: 3px; padding: 0 1px; }
  .hero-term { gap: 8px !important; }
  .hero-term h2 { font-size: 1.5rem; } .aka { font-size: 0.84rem; color: var(--muted); }
  .results ul { list-style: none; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  .results .n { font-size: 0.85rem; color: var(--muted); font-weight: 500; }
  .res { display: flex; flex-direction: column; gap: 2px; width: 100%; padding: 12px 14px; text-align: left; background: var(--tile); border: 0; border-radius: 18px; text-decoration: none; color: var(--text); cursor: pointer; line-height: 1.55; }
  .res:hover .res-t { color: var(--accent); }
  .res-t { font-weight: 700; color: var(--ink); } .res-s { font-size: 0.87rem; color: var(--muted); }
  .more { font-size: 0.84rem; color: var(--muted); }

  /* ポップアップ(用語・メニュー) */
  #sheet { position: fixed; inset: 0; z-index: 40; background: rgba(10, 10, 20, 0.4); display: flex; align-items: flex-end; justify-content: center; }
