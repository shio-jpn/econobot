<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>株トレ道場</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="日本株・米国株をプロの水準まで学ぶ学習アプリ。今日の相場の読み解き、チャート演習、質問機能、トピック別のライブラリ。">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap">
<style>
  /* レイアウト: 暗い背景に角の丸いカードを積む1カラム。上に丸い浮きボタン、下にガラスの帯2つと丸いボタン。暗色で統一した単一テーマ */
  :root {
    color-scheme: dark;
    --bg: #0e0e11; --card: #1a1a1f; --tile: #25252c; --tile2: #2e2e36; --line: rgba(255, 255, 255, 0.07);
    --ink: #f3f2f6; --text: #d2d1d8; --muted: #8f8e99; --faint: #64636d;
    --lav: #b9a7f2; --rose: #e9a5b6; --sky: #8fc4e8; --sage: #9ccfae; --sand: #e4c28e; --coral: #f0a08c;
    --accent: var(--lav); --accent-ink: #17131f; --accent-soft: rgba(185, 167, 242, 0.14);
    --fab: #f1d3c0; --fab-ink: #2a1d15;
    --up: #5fd3a0; --down: #ff7f73; --c-up: #5fd3a0; --c-dn: #ff7f73;
    --ma1: #e4c28e; --ma2: #8fc4e8;
    --warn: #e4c28e; --warn-bg: rgba(228, 194, 142, 0.08); --mark: rgba(185, 167, 242, 0.32);
    --glass: rgba(42, 42, 50, 0.72); --shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
    --sans: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', 'Yu Gothic UI', 'Segoe UI', sans-serif;
    --gl: max(16px, env(safe-area-inset-left, 0px)); --gr: max(16px, env(safe-area-inset-right, 0px));
  }
  :root[data-candle="jp"] { --c-up: #ff7f73; --c-dn: #7fa6ff; }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 15.5px; line-height: 1.8; overflow-wrap: anywhere; }
  [hidden] { display: none !important; }
  a { color: var(--lav); text-decoration: none; }
  a:hover { text-decoration: underline; text-underline-offset: 3px; }
  :focus-visible { outline: 2px solid var(--lav); outline-offset: 2px; border-radius: 8px; }
  h1, h2, h3, h4, p, ul, ol, dl, dd, figure, fieldset { margin: 0; }
  h1, h2, h3, h4 { color: var(--ink); line-height: 1.4; text-wrap: balance; }
  h1 { font-size: clamp(1.45rem, 4vw, 1.85rem); font-weight: 800; }
  h3 { font-size: 1.04rem; } h4 { font-size: 0.97rem; }
  button, input, select, textarea { font: inherit; color: inherit; }
  code { font-size: 0.88em; background: var(--tile); padding: 1px 6px; border-radius: 6px; }
  svg.ico { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  .up { color: var(--up); } .down { color: var(--down); }
  .num, .st-n, .kv dd, .ll-min, table { font-variant-numeric: tabular-nums; }

  /* ---- 上: 丸い浮きボタン ---- */
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
  .top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: linear-gradient(var(--bg) 60%, rgba(14, 14, 17, 0)); }
  .top-in { max-width: 860px; margin: 0 auto; display: flex; align-items: center; gap: 10px; padding: 12px var(--gr) 16px var(--gl); }
  .round, .pill { background: var(--card); border: 1px solid var(--line); box-shadow: var(--shadow); color: var(--ink); }
  .round { width: 48px; height: 48px; border-radius: 24px; display: grid; place-items: center; cursor: pointer; flex: none; }
  .top-title { font-weight: 800; color: var(--ink); font-size: 1.02rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .pill { margin-left: auto; display: flex; border-radius: 24px; padding: 0 4px; flex: none; }
  .pill a, .pill button { width: 46px; height: 46px; display: grid; place-items: center; border: 0; background: none; cursor: pointer; color: var(--ink); border-radius: 23px; position: relative; text-decoration: none !important; }
  .badge { position: absolute; top: 7px; right: 4px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--rose); color: #2a1018; font-size: 10.5px; font-weight: 800; line-height: 18px; text-align: center; }
  #search-form { flex: 1; min-width: 0; display: flex; align-items: center; height: 48px; background: var(--card); border: 1px solid var(--line); border-radius: 24px; box-shadow: var(--shadow); padding-left: 14px; }
  #search-form:focus-within { border-color: var(--lav); }
  #search-form > svg { color: var(--muted); }
  #q { flex: 1; min-width: 0; border: 0; background: none; height: 100%; outline: none; font-size: 16px; color: var(--ink); padding: 0 10px; }
  #q::placeholder { color: var(--faint); }
  .ask-btn { height: 36px; margin-right: 6px; padding: 0 14px; border: 0; border-radius: 18px; background: var(--accent-soft); color: var(--lav); font-weight: 700; cursor: pointer; white-space: nowrap; }
  .top:not(.searching) #search-form, .top:not(.searching) #search-close { display: none; }
  .top.searching .top-title, .top.searching .pill { display: none; }

  /* ---- 下: ガラスの帯2つと丸いボタン ---- */
  .dock { position: fixed; z-index: 25; left: 0; right: 0; bottom: 0; pointer-events: none; padding: 0 var(--gr) calc(14px + env(safe-area-inset-bottom, 0px)) var(--gl); }
  .dock-in { max-width: 560px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .dock-group { pointer-events: auto; display: flex; padding: 4px; border-radius: 30px; background: var(--glass); -webkit-backdrop-filter: blur(18px) saturate(1.5); backdrop-filter: blur(18px) saturate(1.5); border: 1px solid rgba(255, 255, 255, 0.08); box-shadow: var(--shadow); }
  .dock-group a { width: 56px; height: 48px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; border-radius: 24px; color: var(--text); font-size: 10px; font-weight: 700; line-height: 1.2; text-decoration: none !important; }
  .dock-group a[aria-current] { background: rgba(255, 255, 255, 0.1); color: var(--ink); }
  .fab { pointer-events: auto; width: 62px; height: 62px; border-radius: 31px; background: var(--fab); color: var(--fab-ink); display: grid; place-items: center; box-shadow: var(--shadow); text-decoration: none !important; flex: none; }
  .fab svg.ico { width: 26px; height: 26px; stroke-width: 2.2; }
  .fab.on { outline: 3px solid rgba(241, 211, 192, 0.35); }

  /* ---- 電光掲示板(ページ上部) ---- */
  .led-wrap { max-width: 860px; margin: -6px auto 14px; padding-left: var(--gl); padding-right: var(--gr); }
  .led { position: relative; display: block; overflow: hidden; height: 66px; border-radius: 14px; text-decoration: none !important;
    background: radial-gradient(120% 140% at 50% 0%, #1a0f07 0%, #070504 60%); border: 1px solid rgba(255, 255, 255, 0.07); border-top: 2px solid rgba(220, 225, 235, 0.28); border-bottom: 2px solid rgba(220, 225, 235, 0.16);
    box-shadow: inset 0 2px 0 rgba(255, 255, 255, 0.06), inset 0 -10px 18px rgba(0, 0, 0, 0.6), 0 10px 26px rgba(0, 0, 0, 0.45);
    -webkit-mask-image: linear-gradient(90deg, transparent, #000 5%, #000 95%, transparent); mask-image: linear-gradient(90deg, transparent, #000 5%, #000 95%, transparent); }
  .led::after { content: ''; position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(circle, transparent 0.95px, rgba(6, 4, 3, 0.5) 1.35px) 0 0 / 3px 3px; }
  .led-track { position: absolute; top: 0; left: 0; height: 100%; display: flex; white-space: nowrap; will-change: transform; animation: led-run 60s linear infinite; }
  .led:hover .led-track, .led:focus-visible .led-track { animation-play-state: paused; }
  .led-row { display: inline-flex; align-items: center; height: 100%; flex: none; }
  .led-i, .led-h, .led-s { font-family: 'DotGothic16', ui-monospace, 'Osaka-Mono', monospace; font-size: 18px; line-height: 1.35; letter-spacing: 0.04em; }
  .led-i { display: inline-flex; flex-direction: column; justify-content: center; gap: 2px; padding: 0 0.3em; }
  .led-t { display: inline-flex; align-items: baseline; gap: 0.45em; }
  .led-n { color: #ff8c1a; text-shadow: 0 0 6px rgba(255, 120, 20, 0.75); }
  .led-v { color: #ffc266; text-shadow: 0 0 6px rgba(255, 170, 60, 0.7); font-variant-numeric: tabular-nums; }
  .led-c { color: #ffb347; text-shadow: 0 0 6px rgba(255, 160, 50, 0.6); font-variant-numeric: tabular-nums; }
  .led-c.up { color: #4dff8f; text-shadow: 0 0 7px rgba(60, 255, 130, 0.7); }
  .led-c.down { color: #ff4d3d; text-shadow: 0 0 7px rgba(255, 70, 50, 0.8); }
  .led-h { display: inline-flex; align-items: center; padding: 0 0.2em; color: #ffd27a; text-shadow: 0 0 7px rgba(255, 190, 90, 0.75); }
  .led-s { color: #5a3410; padding: 0 0.9em; }
  @keyframes led-run { from { transform: translateX(0); } to { transform: translateX(-50%); } }
  @media (max-width: 560px) { .led { height: 58px; border-radius: 12px; } .led-i, .led-h, .led-s { font-size: 15px; } }
  @media (prefers-reduced-motion: reduce) { .led-track { animation: none; position: static; } .led { overflow-x: auto; } .led-row[aria-hidden] { display: none; } }
  /* ---- 本体とカード ---- */
  .side { display: none; }
  main { max-width: 860px; margin: 0 auto; padding-block: 0 130px; padding-left: var(--gl); padding-right: var(--gr); display: flex; flex-direction: column; gap: 14px; min-width: 0; }
  main section, .card, .page-head, .lesson-head { background: var(--card); border: 1px solid var(--line); border-radius: 26px; padding: 20px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
  main section > h2, .card > h3:first-child { display: flex; align-items: center; gap: 10px; font-size: 1.05rem; font-weight: 800; color: var(--ink); }
  main section > h2 > svg.ico { color: var(--lav); }
  .h-r { margin-left: auto; font-size: 0.84rem; font-weight: 600; color: var(--muted); white-space: nowrap; }
  a.h-r { color: var(--muted); }
  .page-head { gap: 8px; }
  .eyebrow { font-size: 0.8rem; font-weight: 700; color: var(--muted); }
  .crumb { font-size: 0.82rem; color: var(--muted); } .crumb a { color: var(--muted); }
  .lead { color: var(--text); }
  .sub { color: var(--muted); font-size: 0.88rem; }
  .empty { color: var(--muted); }
  .disclaimer { font-size: 0.78rem; color: var(--faint); line-height: 1.7; padding: 2px 8px; }
  ul.plain { list-style: none; padding: 0; display: flex; flex-direction: column; gap: 6px; }
  main ul, main ol { padding-left: 1.3em; display: flex; flex-direction: column; gap: 5px; }
  .dash { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 14px; }
  .dash > * { grid-column: span 12; }
  .span-4 { grid-column: span 4 !important; } .span-5 { grid-column: span 5 !important; } .span-6 { grid-column: span 6 !important; } .span-7 { grid-column: span 7 !important; } .span-8 { grid-column: span 8 !important; }
  .stack { display: flex; flex-direction: column; gap: 14px; min-width: 0; }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; padding: 8px 20px; border-radius: 22px; border: 0; background: var(--lav); color: var(--accent-ink); font-weight: 800; font-size: 0.93rem; text-decoration: none !important; cursor: pointer; line-height: 1.35; text-align: center; }
  .btn.ghost { background: var(--tile); color: var(--ink); }
  .btn.ghost:hover { background: var(--tile2); }
  .btn.small { min-height: 36px; padding: 4px 14px; font-size: 0.85rem; }
  .btn:disabled { opacity: 0.4; cursor: default; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .chips-label { font-size: 0.78rem; font-weight: 700; color: var(--faint); margin-right: 2px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; min-height: 36px; padding: 4px 14px; border-radius: 18px; border: 0; background: var(--tile); color: var(--text); font-size: 0.87rem; text-decoration: none !important; cursor: pointer; line-height: 1.45; text-align: left; }
  .chip:hover { background: var(--tile2); color: var(--ink); }
  .chip.on { background: var(--lav); color: var(--accent-ink); font-weight: 700; }
  .chip em { font-style: normal; font-size: 0.78rem; opacity: 0.7; }
  .term { background: none; border: 0; padding: 0; color: inherit; cursor: pointer; text-decoration: underline dotted var(--lav); text-decoration-thickness: 1.5px; text-underline-offset: 4px; }
  .term:hover { color: var(--lav); }
  .lv { display: inline-block; font-size: 0.7rem; font-weight: 800; padding: 0 8px; border-radius: 10px; line-height: 1.8; vertical-align: 2px; white-space: nowrap; background: var(--tile2); color: var(--muted); }
  .lv-adv { background: rgba(143, 196, 232, 0.16); color: var(--sky); } .lv-prac { background: rgba(228, 194, 142, 0.16); color: var(--sand); } .lv-pro { background: rgba(185, 167, 242, 0.18); color: var(--lav); }
  .pill.up, .pill.down, .pill.flat, .pill.warn, span.pill { display: inline-block; white-space: nowrap; font-size: 0.78rem; font-weight: 700; padding: 1px 10px; border-radius: 12px; line-height: 1.7; margin: 0; box-shadow: none; border: 0; }
  span.pill.up { background: rgba(95, 211, 160, 0.14); color: var(--up); } span.pill.down { background: rgba(255, 127, 115, 0.14); color: var(--down); }
  span.pill.flat { background: var(--tile2); color: var(--muted); } span.pill.warn { background: rgba(228, 194, 142, 0.14); color: var(--warn); }

  /* 領域の色つきアイコン */
  .aico { display: inline-grid; place-items: center; flex: none; }
  .aico svg.ico { width: 22px; height: 22px; stroke-width: 2; }
  .a-market { color: var(--lav); } .a-company { color: var(--sky); } .a-chart { color: var(--sage); } .a-risk { color: var(--rose); } .a-strategy { color: var(--sand); } .a-base { color: var(--coral); }

  /* ---- ホーム: 大きな絵のカード・ひとこと・棚 ---- */
  main section.hero { padding: 0; overflow: hidden; position: relative; gap: 0; background: #08080b; border-color: rgba(255, 255, 255, 0.05); }
  .hero .chart { background: none; border: 0; border-radius: 0; }
  .hero-top { position: absolute; left: 0; right: 0; top: 12px; padding: 0 14px; }
  .ticker { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
  .ticker::-webkit-scrollbar { display: none; }
  .tk { flex: none; display: inline-flex; gap: 6px; align-items: baseline; padding: 3px 11px; border-radius: 14px; background: rgba(0, 0, 0, 0.45); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); font-size: 0.76rem; color: rgba(255, 255, 255, 0.85); text-decoration: none !important; }
  .tk-n { color: rgba(255, 255, 255, 0.6); }
  .hero-cap { position: absolute; left: 0; right: 0; bottom: 14px; text-align: center; color: rgba(255, 255, 255, 0.88); font-size: 0.82rem; font-weight: 600; padding: 0 16px; }
  main section.say { gap: 10px; }
  .say > p:first-child { color: var(--ink); font-size: 1rem; line-height: 1.75; }
  .say .stamp { text-align: center; color: var(--faint); font-size: 0.8rem; }
  main section.shelf { padding: 16px 0; gap: 12px; }
  .shelf-head { display: flex; align-items: center; gap: 10px; padding: 0 20px; color: var(--ink); text-decoration: none !important; }
  .shelf-head strong { font-size: 1.02rem; flex: 1; min-width: 0; }
  .shelf-n { color: var(--muted); font-size: 0.86rem; white-space: nowrap; } .shelf-n i { font-style: normal; margin-left: 8px; }
  .shelf-row { display: flex; gap: 8px; overflow-x: auto; padding: 0 20px 2px; scrollbar-width: none; }
  .shelf-row::-webkit-scrollbar { display: none; }
  .mini { flex: none; width: 92px; height: 92px; border-radius: 18px; background: var(--tile); color: var(--text); text-decoration: none !important; font-size: 0.74rem; line-height: 1.45; padding: 9px 10px; overflow: hidden; display: block; }
  .mini span { display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  .mini:hover { background: var(--tile2); }
  .mini.done { color: var(--muted); } .mini.done span::before { content: "✓ "; color: var(--sage); font-weight: 800; }
  .mini.pic { padding: 0; background: #08080b; }
  .mini.pic svg { display: block; }
  .mini.todo { background: transparent; border: 1.5px dashed var(--tile2); }
  .ring { display: inline-block; width: 11px; height: 11px; border: 1.5px solid var(--muted); border-radius: 50%; margin-right: 4px; vertical-align: -1px; }
  .rank { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; } .rank strong { font-size: 1.5rem; color: var(--lav); }
  .kv { display: flex; flex-direction: column; } .kv div { display: flex; justify-content: space-between; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 0.9rem; }
  .kv dt { color: var(--muted); } .kv dd { color: var(--ink); text-align: right; font-weight: 600; }
  .regime-t { font-size: 1.08rem; font-weight: 800; color: var(--lav); }
  .skill { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px 22px; }
  .skill-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 10px; color: var(--text); text-decoration: none !important; align-items: center; }
  .skill-n { display: flex; align-items: center; gap: 8px; color: var(--ink); font-weight: 700; } .skill-v { font-size: 0.78rem; color: var(--muted); }
  .meter { grid-column: 1 / -1; position: relative; height: 8px; background: var(--tile); border-radius: 4px; display: block; overflow: hidden; }
  .meter > i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--tile2); border-radius: 4px; } .meter > i + i { background: var(--lav); }
  .meter.big > i { background: var(--lav); }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 0.78rem; color: var(--muted); }
  .legend i { display: inline-block; width: 12px; height: 8px; margin-right: 6px; background: var(--tile2); border-radius: 4px; vertical-align: 0; } .legend i.on { background: var(--lav); }
  .area-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
  .area { border-radius: 18px; background: var(--tile); min-width: 0; padding: 6px 0; }
  .area-h { display: flex; align-items: center; gap: 8px; padding: 8px 14px; color: var(--ink); font-weight: 800; text-decoration: none !important; }
  .area ul { list-style: none; padding: 0; gap: 0; }
  .area li a { display: flex; justify-content: space-between; gap: 8px; padding: 5px 14px; color: var(--text); font-size: 0.88rem; text-decoration: none !important; }
  .area li a:hover { color: var(--ink); }
  .area em { font-style: normal; font-size: 0.78rem; color: var(--faint); }
  .principles { list-style: none; padding: 0 !important; counter-reset: p; display: grid !important; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 8px !important; }
  .principles li { counter-increment: p; display: flex; flex-direction: column; gap: 2px; padding: 12px 14px; border-radius: 18px; background: var(--tile); }
  .principles li::before { content: counter(p); color: var(--lav); font-weight: 800; font-size: 0.9rem; }
  .principles strong { color: var(--ink); } .principles span { font-size: 0.85rem; color: var(--muted); line-height: 1.65; }
  .ask-mini { display: flex; gap: 8px; } .ask-mini input { flex: 1; min-width: 0; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
  .tile { display: flex; flex-direction: column; gap: 6px; align-items: flex-start; padding: 14px 16px; background: var(--tile); border-radius: 18px; color: var(--text); line-height: 1.6; }
  .tile strong { color: var(--ink); } .tile span { font-size: 0.85rem; color: var(--muted); flex: 1; }

  /* ---- ライブラリ・トピック ---- */
  .topic-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px; }
  .topic-card { display: flex; flex-direction: column; gap: 6px; padding: 14px 16px; border-radius: 18px; background: var(--tile); color: var(--text); text-decoration: none !important; }
  .topic-card:hover { background: var(--tile2); }
  .topic-card strong { color: var(--ink); }
  .tc-l { font-size: 0.8rem; color: var(--muted); line-height: 1.6; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .tc-m { display: flex; gap: 5px; align-items: center; flex-wrap: wrap; } .tc-m em { margin-left: auto; font-style: normal; font-size: 0.78rem; color: var(--faint); }
  .lesson-list { list-style: none; padding: 0 !important; gap: 8px !important; }
  .lesson-list a { display: grid; grid-template-columns: 24px minmax(0, 1fr) auto; gap: 12px; padding: 12px 14px; color: var(--text); text-decoration: none !important; align-items: start; background: var(--tile); border-radius: 18px; }
  .lesson-list a:hover { background: var(--tile2); }
