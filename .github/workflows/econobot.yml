name: EconoBot - 毎朝8時に米国経済ニュースをSlackに投稿

on:
  schedule:
    # timezone指定があるのでcronは日本時間のまま書く(以前の'30 22'は夜22:30の意味になっていた)。
    # 米国市場の終了(日本時間5〜6時)の後、GitHubの起動遅れを見込んで6:00に起動する
    - cron: '0 6 * * *'
      timezone: 'Asia/Tokyo'
  workflow_dispatch:

jobs:
  post-news:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Python 3.11 セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: EconoBotを実行
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python econobot.py
