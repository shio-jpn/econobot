name: EconoBot - 毎朝8時に米国経済ニュースをSlackに投稿(夕方17時半に学習アプリのデータを更新)

on:
  # 時刻の決め方(2026-11-27に見直し)
  # ・朝: 7:25に取得、8:00に公開・Slackへ投稿(econobot.py)。米国の引けJST 6:00(夏5:00)、財務省の日次金利(米東部の夕方)の後で、東証の寄り付き9:00の前
  # ・夕方: 17:30に学習アプリのデータだけ作り直す(公開・投稿はしない)。日本の引け15:30の後、CBOEの確定値の後、Geminiの1日の枠の切り替わり(JST 17:00・夏16:00)の後
  # GitHubのscheduleは後回しにされ、10/09〜11/17は1〜6時間、11/27は7〜8時間遅れた。そこで目標の時刻より前に30分おきに起動を置き、
  # 最初に始まった起動が目標の時刻まで中で待つ。2回目以降の起動は記録(state/last_posted.txt・state/last_learn.txt)を見て何もせず終わる。
  # 11/27は夕方の起動が1回も来なかった。そこで時刻どおりの起動は時計(clock.yml)が受け持ち、ここのscheduleは予備として残す。
  # 00分・30分は混みやすいので17分・47分にする。timezone指定があるのでcronは日本時間のまま書く
  schedule:
    - cron: '17 2 * * *'   # 朝(早い起動)
      timezone: 'Asia/Tokyo'
    - cron: '47 2 * * *'   # 朝(早い起動)
      timezone: 'Asia/Tokyo'
    - cron: '17 3 * * *'   # 朝(早い起動)
      timezone: 'Asia/Tokyo'
    - cron: '47 3 * * *'   # 朝(早い起動)
      timezone: 'Asia/Tokyo'
    - cron: '17 4 * * *'   # 朝(早い起動)
      timezone: 'Asia/Tokyo'
    - cron: '47 4 * * *'   # 朝(早い起動)
      timezone: 'Asia/Tokyo'
    - cron: '17 5 * * *'   # 朝(早い起動)
      timezone: 'Asia/Tokyo'
    - cron: '47 5 * * *'   # 朝(早い起動)
      timezone: 'Asia/Tokyo'
    - cron: '17 6 * * *'   # 朝(早い起動)
      timezone: 'Asia/Tokyo'
    - cron: '47 6 * * *'   # 朝(早い起動)
      timezone: 'Asia/Tokyo'
    - cron: '17 7 * * *'   # 朝(早い起動)
      timezone: 'Asia/Tokyo'
    - cron: '10 8 * * *'   # 朝(予備。投稿されていなければすぐ投稿)
      timezone: 'Asia/Tokyo'
    - cron: '17 12 * * *'   # 夕方の更新
      timezone: 'Asia/Tokyo'
    - cron: '47 12 * * *'   # 夕方の更新
      timezone: 'Asia/Tokyo'
    - cron: '17 13 * * *'   # 夕方の更新
      timezone: 'Asia/Tokyo'
    - cron: '47 13 * * *'   # 夕方の更新
      timezone: 'Asia/Tokyo'
    - cron: '17 14 * * *'   # 夕方の更新
      timezone: 'Asia/Tokyo'
    - cron: '47 14 * * *'   # 夕方の更新
      timezone: 'Asia/Tokyo'
    - cron: '17 15 * * *'   # 夕方の更新
      timezone: 'Asia/Tokyo'
    - cron: '47 15 * * *'   # 夕方の更新
      timezone: 'Asia/Tokyo'
    - cron: '17 16 * * *'   # 夕方の更新
      timezone: 'Asia/Tokyo'
    - cron: '47 16 * * *'   # 夕方の更新
      timezone: 'Asia/Tokyo'
    - cron: '17 17 * * *'   # 夕方の更新
      timezone: 'Asia/Tokyo'
    - cron: '47 19 * * *'   # 夕方の更新
      timezone: 'Asia/Tokyo'
  # 手動実行:待たずに取得する。7:00より前なら8:00も待たずに投稿する。forceで「今日の分は投稿済み」の記録を無視してやり直せる
  workflow_dispatch:
    inputs:
      force:
        description: '今日の分が投稿済みでも、もう一度公開・投稿する(やり直し用)'
        type: boolean
        default: false
      learn_only:
        description: '学習アプリのデータ(市場データと深掘り分析)だけを作り直す。ページの公開とSlackへの投稿はしない'
        type: boolean
        default: false
      slot:
        description: '時計(clock.yml)が使う。morning=朝の定時(7:25取得・8:00投稿)、evening=夕方の定時(17:30の更新)。手動では空のまま'
        type: string
        default: ''

# 同時に動かさない。GitHubは順番待ちを1つしか持たず、新しく来た起動が前の順番待ちを取り消す(実行中のものは取り消さない)。
# 最初の起動が途中で失敗した日は、残っている順番待ちの起動が動いて、その日の分を投稿する。
# 朝(投稿)と夕方の更新は組を分ける。夕方の起動は昼から17:30まで中で待つので、同じ組だと遅れて来た朝の投稿を足止めしてしまう
concurrency:
  group: ${{ (contains(fromJSON('["17 12 * * *", "47 12 * * *", "17 13 * * *", "47 13 * * *", "17 14 * * *", "47 14 * * *", "17 15 * * *", "47 15 * * *", "17 16 * * *", "47 16 * * *", "17 17 * * *", "47 19 * * *"]'), github.event.schedule) || inputs.slot == 'evening') && 'econobot-evening' || 'econobot-post' }}
  cancel-in-progress: false

jobs:
  post-news:
    runs-on: ubuntu-latest
    # GitHubのジョブの上限(360分)にする。2:17の起動が遅れずに始まると、8:00までの待ち(約5時間43分。途中の7:25に取得・要約、最悪約21分で7:46に終わる)
    # と公開・投稿(最悪約3分)で約5時間50分。
    # 2:15より前に始まったscheduleの起動は、上限を超えないようeconobot.pyが何もせず終える
    timeout-minutes: 360
    permissions:
      contents: write

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v5

      - name: Python 3.11 セットアップ
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: EconoBotを実行
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          # 何の起動か(ログ・失敗の知らせ・記録に出す)。scheduleの時はどの予定(cronの文字列)か、手動の時は空
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE_CRON: ${{ github.event.schedule }}
          FORCE: ${{ inputs.force }}
          LEARN_ONLY: ${{ inputs.learn_only }}
          SLOT: ${{ inputs.slot }}
        run: python -u econobot.py   # -u: ログを途中から見られるよう、出力をためずに出す
